<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
<title>Le Thermomètre | La Carte</title>
<meta name="theme-color" content="#050505" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="manifest" href="./manifest.json" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>
<!-- Le Container WebGL 3D (Arrière-plan absolu) -->
<div id="webgl-container" class="fixed inset-0 z-0 pointer-events-none"></div>

<div id="flash-overlay" class="fixed inset-0 bg-white opacity-0 pointer-events-none z-[200]"></div>
<div id="gold-overlay" class="fixed inset-0 bg-[#FFB800] mix-blend-overlay opacity-0 pointer-events-none z-[150] transition-opacity duration-1000"></div>

<div class="fixed inset-0 w-full h-full overflow-hidden z-10">
  <div class="noise-overlay"></div>

  <button id="hubReturnBtn" class="fixed top-[env(safe-area-inset-top,10px)] left-4 mt-4 z-[200] flex items-center gap-2 text-white/50 hover:text-white transition-colors font-display text-xs uppercase tracking-widest outline-none cursor-pointer pointer-events-auto">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    La Carte
  </button>

  <div id="toasts" class="fixed top-[calc(env(safe-area-inset-top,10px)+4rem)] left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none mt-4"></div>

  <div id="smash-alert" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-lg flex flex-col items-center justify-center pointer-events-none hidden transition-opacity duration-300">
    <div class="relative z-10 flex flex-col items-center w-full px-6 text-center">
       <div id="smash-icon" class="mb-6 flex justify-center w-full"></div>
       <div class="text-4xl font-serif text-white italic tracking-wide mb-4" id="smash-title">Privilège</div>
       <div class="font-display text-sm text-white/70 tracking-widest uppercase" id="smash-subtitle">Détail</div>
    </div>
  </div>

  <div id="counterModal" class="fixed inset-0 z-[60] hidden bg-black/90 backdrop-blur-lg flex items-center justify-center px-5 pointer-events-auto">
    <!-- UI Modal inchangée -->
    <div class="luxury-card w-full max-w-sm p-8 text-center flex flex-col items-center relative overflow-hidden animate-pop">
       <div class="relative z-10 w-full flex flex-col items-center">
          <h2 class="text-2xl font-serif italic mb-2 text-white tracking-wide" id="counter-title">Offensive ciblée</h2>
          <p class="font-display text-white/60 mb-8 text-xs uppercase tracking-widest" id="counter-desc">Quelqu'un s'en prend à vous</p>
          <div class="flex flex-col gap-4 w-full">
            <button onclick="window.confirmCounter()" class="w-full py-4 luxury-btn !border-white !bg-white/10 !text-white flex items-center justify-center gap-3" id="counter-btn-yes">Riposter</button>
            <button onclick="window.ignoreCounter()" class="w-full py-4 text-xs font-display uppercase tracking-widest text-white/40 hover:text-white transition-colors">Subir en silence</button>
          </div>
       </div>
    </div>
  </div>

  <div id="app" class="w-full max-w-md mx-auto h-full overflow-x-hidden overflow-y-auto px-5 pt-16 pb-8 flex flex-col relative z-20 fade-in" style="-webkit-overflow-scrolling: touch;">
    <!-- Injecté par ui.js -->
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
